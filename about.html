<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关于我 · 林砚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div data-site-nav></div>
    <main id="main">
      <header class="page-hero">
        <h1>关于我</h1>
        <p>院校、专业、兴趣方向，以及一段简短的成长时间线。</p>
      </header>
      <section class="about-grid section">
        <div>
          <h2>个人介绍</h2>
          <p id="about-meta" class="muted"></p>
          <div id="about-bio"></div>
          <h2>兴趣与目标</h2>
          <div class="tag-row" id="about-interests"></div>
          <div class="tag-row" id="about-goals" style="margin-top: 0.6rem"></div>
        </div>
        <div>
          <div class="photo-frame" role="img" aria-label="学习生活照片占位"></div>
        </div>
      </section>
      <section class="section">
        <h2>学习成长时间线</h2>
        <div class="timeline" id="about-timeline"></div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const a = SITE.about;
        document.getElementById("about-meta").textContent =
          `${a.school} · ${a.major} · ${a.direction}`;
        document.getElementById("about-bio").innerHTML = a.bio
          .map((p) => `<p>${p}</p>`)
          .join("");
        document.getElementById("about-interests").innerHTML = a.interests
          .map((t) => `<span class="tag">${t}</span>`)
          .join("");
        document.getElementById("about-goals").innerHTML = a.goals
          .map((t) => `<span class="tag">${t}</span>`)
          .join("");
        document.getElementById("about-timeline").innerHTML = a.timeline
          .map(
            (item) => `
            <div class="timeline-item">
              <div class="period">${item.year}</div>
              <div>${item.text}</div>
            </div>`
          )
          .join("");
      });
    </script>
  </body>
</html>
