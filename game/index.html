<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>星渊跃迁 · Stellar Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #070b14;
      --nebula: #0e1a2e;
      --cyan: #3de7ff;
      --amber: #ffb347;
      --coral: #ff6b6b;
      --mist: #a8c0d8;
      --panel: rgba(10, 18, 32, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: #e8f2ff;
      font-family: "Noto Sans SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, #1a3a5c 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 80%, #1a2840 0%, transparent 50%),
        linear-gradient(180deg, #050810 0%, #0a1424 50%, #070b14 100%);
    }

    .shell {
      width: min(100vw, 420px);
      height: min(100dvh, 740px);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(61, 231, 255, 0.18);
      box-shadow:
        0 0 0 1px rgba(255, 179, 71, 0.06) inset,
        0 24px 60px rgba(0, 0, 0, 0.55);
      background: linear-gradient(165deg, rgba(14, 26, 46, 0.95), rgba(7, 11, 20, 0.98));
      overflow: hidden;
    }

    header.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      z-index: 2;
    }

    .brand {
      font-family: Orbitron, sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(61, 231, 255, 0.45);
    }

    .stats {
      display: flex;
      gap: 14px;
      font-family: Orbitron, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--mist);
    }

    .stats strong {
      color: var(--amber);
      font-weight: 700;
    }

    #game {
      flex: 1;
      width: 100%;
      display: block;
      cursor: none;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 30%, rgba(61, 231, 255, 0.12), transparent 45%),
        rgba(5, 8, 16, 0.82);
      backdrop-filter: blur(6px);
      z-index: 5;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay h1 {
      font-family: Orbitron, sans-serif;
      font-weight: 900;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      letter-spacing: 0.08em;
      color: #fff;
      margin-bottom: 8px;
      animation: pulse-glow 2.4s ease-in-out infinite;
    }

    .overlay h1 span {
      display: block;
      color: var(--cyan);
      font-size: 0.55em;
      letter-spacing: 0.28em;
      margin-top: 6px;
      font-weight: 500;
    }

    .overlay p {
      max-width: 280px;
      color: var(--mist);
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 12px 0 28px;
    }

    .btn {
      font-family: Orbitron, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      padding: 14px 36px;
      border: 1px solid rgba(61, 231, 255, 0.55);
      background: linear-gradient(135deg, rgba(61, 231, 255, 0.22), rgba(255, 179, 71, 0.12));
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s;
      box-shadow: 0 0 24px rgba(61, 231, 255, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(61, 231, 255, 0.35);
      background: linear-gradient(135deg, rgba(61, 231, 255, 0.35), rgba(255, 179, 71, 0.2));
    }

    .btn:active { transform: scale(0.97); }

    .hint {
      margin-top: 22px;
      font-size: 0.75rem;
      color: rgba(168, 192, 216, 0.65);
      line-height: 1.6;
    }

    .result-score {
      font-family: Orbitron, sans-serif;
      font-size: 2.4rem;
      color: var(--amber);
      margin: 8px 0 4px;
    }

    .result-sub {
      color: var(--mist);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    footer.bar {
      padding: 8px 16px 14px;
      font-size: 0.7rem;
      color: rgba(168, 192, 216, 0.5);
      text-align: center;
      letter-spacing: 0.04em;
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 12px rgba(61, 231, 255, 0.3); }
      50% { text-shadow: 0 0 28px rgba(61, 231, 255, 0.65), 0 0 48px rgba(255, 179, 71, 0.2); }
    }

    @media (max-width: 400px) {
      .shell { border: none; height: 100dvh; width: 100vw; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">STELLAR DASH</div>
      <div class="stats">
        <div>SCORE <strong id="scoreEl">0</strong></div>
        <div>BEST <strong id="bestEl">0</strong></div>
      </div>
    </header>

    <canvas id="game" width="400" height="600"></canvas>

    <div class="overlay" id="startOverlay">
      <h1>星渊跃迁<span>STELLAR DASH</span></h1>
      <p>操控飞船左右穿梭，躲开陨石，收集星尘。坚持越久，跃迁越狂暴。</p>
      <button class="btn" id="startBtn" type="button">开始跃迁</button>
      <div class="hint">桌面：← → 或 A D<br />手机：滑动 / 触控左右半屏</div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h1>跃迁中断<span>MISSION FAILED</span></h1>
      <div class="result-score" id="finalScore">0</div>
      <div class="result-sub">本局得分 · 最高 <span id="finalBest">0</span></div>
      <button class="btn" id="retryBtn" type="button">再次跃迁</button>
    </div>

    <footer class="bar">收集星尘加分 · 撞击陨石结束</footer>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("scoreEl");
      const bestEl = document.getElementById("bestEl");
      const startOverlay = document.getElementById("startOverlay");
      const overOverlay = document.getElementById("overOverlay");
      const finalScore = document.getElementById("finalScore");
      const finalBest = document.getElementById("finalBest");

      const W = canvas.width;
      const H = canvas.height;
      const BEST_KEY = "stellar_dash_best";

      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      const state = {
        running: false,
        score: 0,
        time: 0,
        ship: { x: W / 2, y: H - 78, w: 28, h: 36, vx: 0 },
        rocks: [],
        stars: [],
        particles: [],
        bgStars: [],
        keys: { left: false, right: false },
        shake: 0,
        spawnRock: 0,
        spawnStar: 0,
      };

      for (let i = 0; i < 60; i++) {
        state.bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          z: 0.3 + Math.random() * 1.4,
          a: 0.25 + Math.random() * 0.6,
        });
      }

      function reset() {
        state.score = 0;
        state.time = 0;
        state.ship.x = W / 2;
        state.ship.vx = 0;
        state.rocks = [];
        state.stars = [];
        state.particles = [];
        state.shake = 0;
        state.spawnRock = 0;
        state.spawnStar = 0;
        scoreEl.textContent = "0";
      }

      function startGame() {
        reset();
        state.running = true;
        startOverlay.classList.add("hidden");
        overOverlay.classList.add("hidden");
      }

      function endGame() {
        state.running = false;
        if (state.score > best) {
          best = state.score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = String(best);
        }
        finalScore.textContent = String(state.score);
        finalBest.textContent = String(best);
        overOverlay.classList.remove("hidden");
        burst(state.ship.x, state.ship.y, "#ff6b6b", 28);
      }

      function burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 4;
          state.particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 30 + Math.random() * 25,
            color,
            size: 1.5 + Math.random() * 2.5,
          });
        }
      }

      function difficulty() {
        return 1 + state.time / 28;
      }

      function spawnRock() {
        const size = 16 + Math.random() * 28;
        state.rocks.push({
          x: size + Math.random() * (W - size * 2),
          y: -size,
          r: size / 2,
          vy: 1.6 + Math.random() * 1.8 + difficulty() * 0.55,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.08,
          sides: 5 + Math.floor(Math.random() * 3),
        });
      }

      function spawnStar() {
        state.stars.push({
          x: 20 + Math.random() * (W - 40),
          y: -12,
          r: 7,
          vy: 1.4 + Math.random() * 1.2 + difficulty() * 0.25,
          pulse: Math.random() * Math.PI * 2,
        });
      }

      function update(dt) {
        if (!state.running) {
          updateParticles(dt);
          return;
        }

        state.time += dt;
        const d = difficulty();

        state.spawnRock -= dt;
        state.spawnStar -= dt;
        if (state.spawnRock <= 0) {
          spawnRock();
          state.spawnRock = Math.max(0.28, 1.05 - d * 0.12);
        }
        if (state.spawnStar <= 0) {
          spawnStar();
          state.spawnStar = 1.4 + Math.random() * 0.9;
        }

        const accel = 980;
        const maxV = 320;
        if (state.keys.left) state.ship.vx -= accel * dt;
        if (state.keys.right) state.ship.vx += accel * dt;
        if (!state.keys.left && !state.keys.right) state.ship.vx *= Math.pow(0.04, dt);
        state.ship.vx = Math.max(-maxV, Math.min(maxV, state.ship.vx));
        state.ship.x += state.ship.vx * dt;
        state.ship.x = Math.max(state.ship.w / 2 + 4, Math.min(W - state.ship.w / 2 - 4, state.ship.x));

        for (const s of state.bgStars) {
          s.y += s.z * (40 + d * 35) * dt;
          if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
          }
        }

        for (let i = state.rocks.length - 1; i >= 0; i--) {
          const r = state.rocks[i];
          r.y += r.vy * 60 * dt;
          r.rot += r.vr;
          if (r.y - r.r > H + 20) {
            state.rocks.splice(i, 1);
            continue;
          }
          const dx = r.x - state.ship.x;
          const dy = r.y - (state.ship.y - 4);
          if (dx * dx + dy * dy < (r.r + 12) * (r.r + 12)) {
            state.shake = 12;
            endGame();
            return;
          }
        }

        for (let i = state.stars.length - 1; i >= 0; i--) {
          const s = state.stars[i];
          s.y += s.vy * 60 * dt;
          s.pulse += dt * 6;
          if (s.y > H + 20) {
            state.stars.splice(i, 1);
            continue;
          }
          const dx = s.x - state.ship.x;
          const dy = s.y - (state.ship.y - 4);
          if (dx * dx + dy * dy < (s.r + 14) * (s.r + 14)) {
            state.score += 10;
            scoreEl.textContent = String(state.score);
            burst(s.x, s.y, "#ffb347", 12);
            state.stars.splice(i, 1);
          }
        }

        // survival points
        state.score += Math.floor(d * 8 * dt);
        scoreEl.textContent = String(state.score);

        if (state.shake > 0) state.shake *= Math.pow(0.02, dt);
        updateParticles(dt);
      }

      function updateParticles(dt) {
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.life -= 60 * dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }
      }

      function drawShip(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // engine glow
        const g = ctx.createRadialGradient(0, 18, 0, 0, 18, 22);
        g.addColorStop(0, "rgba(61,231,255,0.7)");
        g.addColorStop(1, "rgba(61,231,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 20 + Math.sin(state.time * 20) * 2, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(14, 16);
        ctx.lineTo(0, 10);
        ctx.lineTo(-14, 16);
        ctx.closePath();
        const body = ctx.createLinearGradient(0, -20, 0, 16);
        body.addColorStop(0, "#dff9ff");
        body.addColorStop(0.45, "#3de7ff");
        body.addColorStop(1, "#1a6f8a");
        ctx.fillStyle = body;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#ffb347";
        ctx.beginPath();
        ctx.moveTo(-10, 12);
        ctx.lineTo(-18, 20);
        ctx.lineTo(-4, 14);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(10, 12);
        ctx.lineTo(18, 20);
        ctx.lineTo(4, 14);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawRock(r) {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rot);
        ctx.beginPath();
        for (let i = 0; i < r.sides; i++) {
          const a = (i / r.sides) * Math.PI * 2;
          const rr = r.r * (0.75 + ((i * 37) % 10) / 40);
          const px = Math.cos(a) * rr;
          const py = Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        const g = ctx.createRadialGradient(-r.r * 0.3, -r.r * 0.3, 2, 0, 0, r.r);
        g.addColorStop(0, "#6a7a90");
        g.addColorStop(1, "#2a3344");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "rgba(200,220,240,0.25)";
        ctx.stroke();
        ctx.restore();
      }

      function drawStarPick(s) {
        const pulse = 1 + Math.sin(s.pulse) * 0.15;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = "rgba(255,179,71,0.25)";
        ctx.beginPath();
        ctx.arc(0, 0, s.r * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffb347";
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
          const a2 = a + Math.PI / 5;
          ctx.lineTo(Math.cos(a) * s.r, Math.sin(a) * s.r);
          ctx.lineTo(Math.cos(a2) * s.r * 0.42, Math.sin(a2) * s.r * 0.42);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.save();
        if (state.shake > 0.4) {
          ctx.translate(
            (Math.random() - 0.5) * state.shake,
            (Math.random() - 0.5) * state.shake
          );
        }

        // space
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#0b1528");
        sky.addColorStop(0.55, "#0a1220");
        sky.addColorStop(1, "#12100e");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // nebula wash
        const neb = ctx.createRadialGradient(W * 0.7, H * 0.2, 10, W * 0.7, H * 0.2, W * 0.7);
        neb.addColorStop(0, "rgba(40, 90, 120, 0.22)");
        neb.addColorStop(1, "transparent");
        ctx.fillStyle = neb;
        ctx.fillRect(0, 0, W, H);

        for (const s of state.bgStars) {
          ctx.globalAlpha = s.a;
          ctx.fillStyle = "#cfe8ff";
          ctx.fillRect(s.x, s.y, s.z, s.z);
        }
        ctx.globalAlpha = 1;

        for (const r of state.rocks) drawRock(r);
        for (const s of state.stars) drawStarPick(s);

        if (state.running || state.particles.length) {
          drawShip(state.ship.x, state.ship.y);
        }

        for (const p of state.particles) {
          ctx.globalAlpha = Math.max(0, p.life / 40);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // vignette
        const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
        vig.addColorStop(0, "transparent");
        vig.addColorStop(1, "rgba(0,0,0,0.35)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

        ctx.restore();
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      document.getElementById("startBtn").addEventListener("click", startGame);
      document.getElementById("retryBtn").addEventListener("click", startGame);

      window.addEventListener("keydown", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") state.keys.left = true;
        if (e.code === "ArrowRight" || e.code === "KeyD") state.keys.right = true;
        if ((e.code === "Space" || e.code === "Enter") && !state.running) startGame();
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") state.keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") state.keys.right = false;
      });

      let touchX = null;
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        touchX = e.clientX;
        const rect = canvas.getBoundingClientRect();
        const mid = rect.left + rect.width / 2;
        state.keys.left = e.clientX < mid;
        state.keys.right = e.clientX >= mid;
        if (!state.running && startOverlay.classList.contains("hidden") === false) {
          // let button handle start
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (touchX == null) return;
        const rect = canvas.getBoundingClientRect();
        const local = ((e.clientX - rect.left) / rect.width) * W;
        const dx = local - state.ship.x;
        state.keys.left = dx < -8;
        state.keys.right = dx > 8;
        if (Math.abs(dx) <= 8) {
          state.keys.left = false;
          state.keys.right = false;
        }
      });
      canvas.addEventListener("pointerup", () => {
        touchX = null;
        state.keys.left = false;
        state.keys.right = false;
      });
      canvas.addEventListener("pointercancel", () => {
        touchX = null;
        state.keys.left = false;
        state.keys.right = false;
      });
    })();
  </script>
</body>
</html>
