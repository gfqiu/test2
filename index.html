<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠 · Whack-a-Mole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <h1 class="logo">打地鼠</h1>
      <p class="tagline">瞅准时机，敲扁冒头的小家伙</p>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div class="stat">
        <span class="stat-label">得分</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">时间</span>
        <span id="time" class="stat-value">30</span>
      </div>
      <div class="stat">
        <span class="stat-label">连击</span>
        <span id="combo" class="stat-value">0</span>
      </div>
    </section>

    <section class="board" id="board" aria-label="地鼠洞"></section>

    <div class="actions">
      <button type="button" id="startBtn" class="btn-primary">开始游戏</button>
    </div>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <div class="overlay-panel">
        <h2 id="overlayTitle">时间到！</h2>
        <p id="overlayMsg">你的得分是 0</p>
        <button type="button" id="restartBtn" class="btn-primary">再来一局</button>
      </div>
    </div>
  </main>

  <script src="./js/game.js"></script>
</body>
</html>
