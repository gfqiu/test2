<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技能栈 · 林砚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div data-site-nav></div>
    <main id="main">
      <header class="page-hero">
        <h1>技能栈</h1>
        <p>按前端、后端、工具与其他分类展示掌握程度。</p>
      </header>
      <section class="section" id="skills-root"></section>
    </main>
    <div data-site-footer></div>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const root = document.getElementById("skills-root");
        root.innerHTML = SITE.skills
          .map(
            (group) => `
            <div class="skill-group">
              <h2>${group.category}</h2>
              ${group.items
                .map(
                  (item) => `
                  <div class="skill-row">
                    <div>${item.name}</div>
                    <div class="bar" aria-hidden="true"><span data-level="${item.level}"></span></div>
                    <div class="muted">${item.level}%</div>
                  </div>`
                )
                .join("")}
            </div>`
          )
          .join("");
        SiteApp.animateSkillBars();
      });
    </script>
  </body>
</html>
